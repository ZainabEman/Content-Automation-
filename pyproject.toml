[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "content-automation"
version = "0.1.0"
description = "A local, traceable foundation for AI-assisted content workflows."
requires-python = ">=3.13,<3.14"
dependencies = [
    "boto3>=1.43.111",
    "elevenlabs>=2.70.0",
    "feedparser>=6.0.14",
    "google-api-python-client>=2.150",
    "google-auth-oauthlib>=1.2",
    "httpx>=0.28.1",
    "imageio-ffmpeg>=0.5",
    "opencv-python-headless>=4.10,<5",
    "pillow>=11",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "rapidocr-onnxruntime>=1.4",
    "rembg>=2.0.60",
    "trafilatura>=2.2.0",
    "typer>=0.12",
]

[project.scripts]
ca = "content_automation.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
cache-dir = ".uv-cache"  # inside the project: Codex's sandbox runs `uv run ca` without prompts
# rapidocr-onnxruntime asks for the full opencv-python (5.x drops CascadeClassifier); the
# headless 4.x package already provides cv2.
override-dependencies = ["opencv-python ; sys_platform == 'never'"]

[tool.hatch.build.targets.wheel]
packages = ["src/content_automation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -p no:cacheprovider"

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "imageio_ffmpeg",
    "feedparser",
    "googleapiclient.*",
    "google_auth_oauthlib.*",
    "httplib2",
    "oauthlib.*",
    "boto3",
    "botocore.*",
    "rapidocr_onnxruntime",
    "rembg",
]
ignore_missing_imports = true

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]
extend-exclude = [".uv-cache", ".pytest-tmp"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
