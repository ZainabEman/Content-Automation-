[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "content-automation"
version = "0.1.0"
description = "A local, traceable foundation for AI-assisted content workflows."
requires-python = ">=3.13,<3.14"
dependencies = [
    "elevenlabs>=2.70.0",
    "google-genai>=2.3.0",
    "imageio-ffmpeg>=0.5",
    "pillow>=11",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "typer>=0.12",
]

[project.scripts]
ca = "content_automation.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/content_automation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -p no:cacheprovider"

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["imageio_ffmpeg"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["imagegen", ".uv-cache", ".pytest-tmp"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
