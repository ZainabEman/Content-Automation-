<h1>Geklonte Stimme fordert Eilüberweisung</h1>
<p>MOCK-TESTSEITE. In diesem Beispielfall erhielt eine Buchhaltung einen Anruf. Die Buchhaltung sollte nach dem Anruf eine Überweisung über 48.000 Euro freigeben.</p>
<p>„Die Stimme klang genau wie die unseres Geschäftsführers“, sagte die Leiterin der Buchhaltung.</p>
